name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beast-invoice-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beast-invoice-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # build-time only; runtime secrets live in Vercel
          TURSO_DATABASE_URL: ''
